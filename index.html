

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Sreetoma ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff6b9d;
            --hot-pink: #ff0055;
            --dark-bg: #0a0514;
            --glass: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--dark-bg); 
            color: #fff; 
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- STUNNING BACKGROUND --- */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(circle at center, #1a0b2e 0%, #0a0514 100%);
        }

        .floating-heart {
            position: absolute; color: var(--pink); opacity: 0.3;
            pointer-events: none; animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* --- LIVE BIRTHDAY COUNTDOWN --- */
        .countdown-bar {
            position: fixed; top: 0; width: 100%; padding: 10px;
            background: rgba(255, 107, 157, 0.1); backdrop-filter: blur(10px);
            z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center; font-weight: 600; letter-spacing: 1px;
            color: var(--pink); display: none;
        }

        /* --- PASSWORD ENTRANCE --- */
        #entrance {
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        .pass-card {
            background: var(--glass); backdrop-filter: blur(20px);
            padding: 3rem; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
            text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .pass-card h1 { font-family: 'Great Vibes', cursive; font-size: 3rem; margin-bottom: 1rem; color: var(--pink); }

        .styled-input {
            width: 100%; padding: 12px; border-radius: 50px; border: none;
            background: white; color: #333; text-align: center; font-size: 1.1rem;
            margin-bottom: 20px; outline: none; box-shadow: 0 5px 15px rgba(255,107,157,0.3);
        }

        .primary-btn {
            background: linear-gradient(45deg, var(--pink), var(--hot-pink));
            color: white; border: none; padding: 12px 40px; border-radius: 50px;
            cursor: pointer; font-weight: 600; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255,0,85,0.3);
        }

        .primary-btn:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(255,0,85,0.5); }

        /* --- PHOTO GALLERY --- */
        #main-content { display: none; padding-top: 80px; }

        .hero-title {
            text-align: center; font-family: 'Dancing Script', cursive;
            font-size: 4.5rem; margin-bottom: 10px;
            background: linear-gradient(to right, #fff, var(--pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .gallery {
            column-count: 4; column-gap: 20px; padding: 40px;
            max-width: 1300px; margin: 0 auto;
        }

        .photo-card {
            break-inside: avoid; margin-bottom: 20px; border-radius: 20px;
            overflow: hidden; position: relative; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .photo-card img { width: 100%; display: block; filter: grayscale(20%); transition: 0.5s; }
        
        .photo-card:hover { transform: scale(1.03) translateY(-10px); }
        .photo-card:hover img { filter: grayscale(0%); transform: scale(1.1); }

        /* --- ABIR CHATBOT --- */
        .chat-widget { position: fixed; bottom: 30px; right: 30px; z-index: 2000; }

        .chat-trigger {
            background: var(--hot-pink); color: white; padding: 15px 25px;
            border-radius: 50px; cursor: pointer; font-weight: 600;
            box-shadow: 0 10px 30px rgba(255,0,85,0.4);
            display: flex; align-items: center; gap: 10px; animation: bounce 2s infinite;
        }

        .chat-box {
            width: 350px; height: 500px; background: white; border-radius: 25px;
            position: absolute; bottom: 80px; right: 0; display: none;
            flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .chat-header { background: var(--hot-pink); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; color: #333; }
        
        .m-abir { background: #f0f0f0; align-self: flex-start; padding: 10px 15px; border-radius: 15px 15px 15px 2px; font-size: 0.9rem; }
        .m-user { background: var(--pink); color: white; align-self: flex-end; padding: 10px 15px; border-radius: 15px 15px 2px 15px; font-size: 0.9rem; }

        .chat-options { padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid #eee; }
        .opt { font-size: 0.75rem; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--pink); color: var(--pink); cursor: pointer; background: #fff; transition: 0.2s; }
        .opt:hover { background: var(--pink); color: white; }

        /* --- LETTER OVERLAY --- */
        .letter-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 5, 20, 0.98); z-index: 3000;
            display: none; align-items: center; justify-content: center;
        }

        .letter-paper {
            max-width: 600px; width: 90%; background: #fffaf0; color: #2c3e50;
            padding: 50px; border-radius: 5px; box-shadow: 0 0 50px rgba(255,107,157,0.3);
            font-family: 'Playfair Display', serif; font-size: 1.2rem; line-height: 1.8;
            position: relative;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) { .gallery { column-count: 2; } .chat-box { width: 85vw; right: -20px; } }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div id="bg-canvas"></div>
    <div class="countdown-bar" id="cBar">Birthday in: --d --h --m --s</div>

    <section id="entrance">
        <div class="pass-card">
            <h1>Sreetoma</h1>
            <p style="margin-bottom: 20px; opacity: 0.8;">A place for our memories only.</p>
            <input type="password" id="pInput" class="styled-input" placeholder="Enter Access Code">
            <button class="primary-btn" onclick="startExperience()">Unlock My Heart</button>
        </div>
    </section>

    <section id="main-content">
        <h1 class="hero-title">Sreetoma Mazumdar</h1>
        <p style="text-align: center; font-style: italic; margin-bottom: 30px;">"You are my favorite kind of magic."</p>
        
        <div style="text-align: center; margin-bottom: 40px;">
            <button class="primary-btn" onclick="toggleLetter(true)">Open My Letter 💌</button>
        </div>

        <div class="gallery" id="photoGrid"></div>
    </section>

    <div class="chat-widget" id="chatWidget" style="display: none;">
        <div class="chat-trigger" onclick="toggleChat()">
            <span>Wanna talk with Abir? ❤️</span>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="chat-header">
                <span>Abir 🟢 <small>Active</small></span>
                <span style="cursor:pointer" onclick="toggleChat()">&times;</span>
            </div>
            <div class="chat-body" id="chatBody"></div>
            <div class="chat-options">
                <button class="opt" onclick="askAbir('I love you!')">I love you!</button>
                <button class="opt" onclick="askAbir('How do I look?')">How do I look? ✨</button>
                <button class="opt" onclick="askAbir('Tell me a secret')">Tell me a secret 🤫</button>
                <button class="opt" onclick="askAbir('Can you sing for me?')">Sing for me? 🎵</button>
            </div>
        </div>
    </div>

    <div class="letter-overlay" id="letterOverlay">
        <div class="letter-paper">
            <div id="typewriter"></div>
            <button class="primary-btn" style="margin-top: 30px; display: block; width: 100%;" onclick="toggleLetter(false)">Back to Gallery</button>
        </div>
    </div>

    <audio id="player" loop><source src="Until I Found you.mp3" type="audio/mpeg"></audio>

    <script>
        const ACCESS_CODE = "2252421098";
        
        // --- Entrance Logic ---
        function startExperience() {
            const code = document.getElementById('pInput').value;
            if(code === ACCESS_CODE) {
                document.getElementById('entrance').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('chatWidget').style.display = 'block';
                document.getElementById('cBar').style.display = 'block';
                document.getElementById('player').play();
                init();
            } else {
                alert("Incorrect code, beautiful. Try again!");
            }
        }

        // --- Init Features ---
        function init() {
            generateHearts();
            loadPhotos();
            startTimer();
        }

        // --- Photo Loader ---
        function loadPhotos() {
            const grid = document.getElementById('photoGrid');
            for(let i=1; i<=60; i++) {
                grid.innerHTML += `
                    <div class="photo-card">
                        <img src="images/${i}.jpg" onerror="this.src='https://via.placeholder.com/400x500/ff6b9d/ffffff?text=Memory+${i}'">
                    </div>
                `;
            }
        }

        // --- Countdown Timer ---
        function startTimer() {
            const target = new Date("February 10, 2026 00:00:00").getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const d = target - now;
                const days = Math.floor(d / (1000 * 60 * 60 * 24));
                const hours = Math.floor((d % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((d % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((d % (1000 * 60)) / 1000);
                document.getElementById('cBar').innerHTML = `Birthday in: ${days}d ${hours}h ${mins}m ${secs}s`;
            }, 1000);
        }

        // --- Chatbot Logic ---
        function toggleChat() {
            const box = document.getElementById('chatBox');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
            if(box.style.display === 'flex' && document.getElementById('chatBody').children.length === 0) {
                abirSay("Hey Sreetoma! I'm so happy you're here. You look stunning today (I just know it). What's on your mind? ❤️");
            }
        }

        function abirSay(text) {
            const body = document.getElementById('chatBody');
            const msg = document.createElement('div');
            msg.className = 'm-abir';
            msg.innerHTML = `<b>Abir:</b> ${text}`;
            body.appendChild(msg);
            body.scrollTop = body.scrollHeight;
        }

        function askAbir(q) {
            const body = document.getElementById('chatBody');
            const userMsg = document.createElement('div');
            userMsg.className = 'm-user';
            userMsg.textContent = q;
            body.appendChild(userMsg);

            let response = "You're so precious to me.";
            if(q.includes("love")) response = "I love you more than words, more than this code, and definitely more than anyone else! ❤️";
            if(q.includes("look")) response = "Even if the screen is off, your reflection is the most beautiful thing in this world. ✨";
            if(q.includes("secret")) response = "My secret? Every time my phone buzzes, I hope it's a message from you. 🤫";
            if(q.includes("sing")) response = "I'm already playing 'Until I Found You' for you... but I'd hum it in your ear any day. 🎵";

            setTimeout(() => abirSay(response), 800);
        }

        // --- Typewriter Letter ---
        const letterContent = `Dear Sreetoma,\n\nI built this world just for you. Every photo in this gallery is a reminder of how lucky I am to know you. You aren't just a person to me; you're my favorite thought, my best memory, and my future.\n\nI hope this little surprise makes your day. You deserve everything beautiful in this world.\n\nHappy Birthday Month, my love.\n\nAlways yours,\nAbir ❤️`;

        function toggleLetter(show) {
            const overlay = document.getElementById('letterOverlay');
            overlay.style.display = show ? 'flex' : 'none';
            if(show) {
                let i = 0;
                document.getElementById('typewriter').textContent = "";
                function type() {
                    if (i < letterContent.length) {
                        document.getElementById('typewriter').textContent += letterContent.charAt(i);
                        i++; setTimeout(type, 50);
                    }
                }
                type();
            }
        }

        // --- Visual Extras ---
        function generateHearts() {
            const canvas = document.getElementById('bg-canvas');
            for(let i=0; i<20; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 10 + 10) + 's';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                document.body.appendChild(heart);
            }
        }
    </script>
</body>
</html>
