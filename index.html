            startTimer();

                    </div>
                `;
            }
        }

            const target = new Date("February 10, 2026 00:00:00").getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const d = target - now;
                const days = Math.floor(d / (1000 * 60 * 60 * 24));
                const hours = Math.floor((d % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((d % (1000 * 60 * 60)) / (1000 * 60));

            if(show) {
                let i = 0;
                document.getElementById('typewriter').textContent = "";

                        document.getElementById('typewriter').textContent += letterContent.charAt(i);

                    }
                }
                type();

                heart.style.animationDuration = (Math.random() * 10 + 10) + 's';

    <style>
        :root {

        body {
            background: var(--dark-bg);

            background: radial-gradient(circle at center, #1a0b2e 0%, #0a0514 100%);
        }
        .floating-heart {
            position: absolute; color: var(--pink); opacity: 0.35;
            pointer-events: none; animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity:0; }
            50% { opacity:0.7; }

        }

        .countdown-bar {
            position: fixed; top:0; width:100%; padding:10px;

        }

        #entrance {
            height:100vh; display:flex; align-items:center; justify-content:center;
        }
        .pass-card {
            background:var(--glass); backdrop-filter:blur(20px);
            padding:2.5rem; border-radius:28px; border:1px solid rgba(255,255,255,0.12);
            text-align:center; width:90%; max-width:380px;
            box-shadow:0 20px 50px rgba(0,0,0,0.6);
        }
        .pass-card h1 { font-family:'Great Vibes',cursive; font-size:3.2rem; color:var(--pink); margin-bottom:0.8rem; }
        .styled-input {
            width:100%; padding:12px; border-radius:50px; border:none;
            background:#fff; color:#222; text-align:center; font-size:1.05rem;
            margin:1.2rem 0; outline:none;
        }
        .primary-btn {
            background:linear-gradient(45deg,var(--pink),var(--hot-pink));
            color:white; border:none; padding:12px 36px; border-radius:50px;
            cursor:pointer; font-weight:600; transition:all 0.3s;
            box-shadow:0 8px 20px rgba(255,0,85,0.35);
        }
        .primary-btn:active { transform:scale(0.96); }

        #main-content { display:none; padding:90px 15px 80px; text-align:center; }
        .hero-title {
            font-family:'Dancing Script',cursive; font-size:clamp(3rem,9vw,5rem);
            background:linear-gradient(90deg,#fff,var(--pink),#fff);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            margin-bottom:0.5rem; animation:glow 4s infinite alternate;
        }
        @keyframes glow { 0%,100% { text-shadow:0 0 15px var(--pink); } 50% { text-shadow:0 0 30px var(--hot-pink); } }

        /* ─── PREFERRED 3D CAROUSEL (multiple visible, angled sides) ─── */
        .scene {
            perspective: 1200px;
            width: 100%;
            max-width: 1100px;
            height: 70vh;
            margin: 50px auto;
            position: relative;
        }
        .carousel {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            animation: spin var(--duration) linear infinite;
        }
        .carousel:hover, .carousel:active { animation-play-state: paused; }

        .item {
            position: absolute;
            inset: 0;
            transform-origin: center;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }
        .item img {
            width: var(--item-width);
            height: var(--item-height);
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 2px solid rgba(255,107,157,0.25);
            transition: all 0.6s ease;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        .item.active img { transform: translate(-50%, -50%) scale(1.12); box-shadow: 0 25px 60px rgba(255,107,157,0.5); }

        @keyframes spin { to { transform: rotateY(360deg); } }

        /* ─── Responsiveness ─── */
        @media (max-width: 1024px) {

            :root { --radius: 220px; --item-width: 180px; --item-height: 270px; --angle: 30deg; --duration: 65s; }

            :root { --radius: 160px; --item-width: 140px; --item-height: 210px; --angle: 40deg; }
            .hero-title { font-size: 2.6rem; }
        }

        /* Chat, Letter, etc. (kept compact - copy your full styles here if needed) */
        .chat-widget { position:fixed; bottom:25px; right:25px; z-index:2000; display:none; }
        /* ... your chat styles ... */

        .letter-overlay { /* your styles */ }
    </style>
</head>

            <div class="carousel" id="carousel"></div>

    <audio id="player" loop playsinline><source src="Until I Found you.mp3" type="audio/mpeg"></audio>

    <script>

                document.getElementById('main-content').style.display = 'block';

                init();
            } else {
                alert("Try again, beautiful 💕");
            }
        }

        function init() {
            generateHearts();
            buildCarousel();
            startTimer();
            // Add your toggleChat, toggleLetter, askAbir functions here...
        }

        function buildCarousel() {
            const container = document.getElementById('carousel');
            let html = '';
            for (let i = 1; i <= TOTAL_IMAGES; i++) {
                const rot = (i - 1) * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--angle'));
                html += `
                    <div class="item" style="transform: rotateY(${rot}deg) translateZ(var(--radius));">

                const h = Math.floor((dist % 86400000) / 3600000);
                const m = Math.floor((dist % 3600000) / 60000);
                const s = Math.floor((dist % 60000) / 1000);
                document.getElementById('cBar').textContent = `Birthday glow: ${d}d ${h}h ${m}m ${s}s ✨`;
            }, 1000);
        }

        // Paste your toggleLetter, abirSay, askAbir, toggleChat here...
    </script>
