<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>For My Sreetoma ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff6b9d;
            --hot-pink: #ff0055;  
            --dark-bg: #0a0514;
            --glass: rgba(255, 255, 255, 0.08);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--dark-bg);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            margin: 0;
            touch-action: pan-y;
            height: 100%;
            position: relative;
        }

        /* Background & Hearts (background remains) */
        #bg-canvas {
            position: fixed; inset: 0; z-index: -2;
            background: radial-gradient(circle at center, #1a0b2e 0%, #0a0514 100%);
        }
        .floating-heart {
            position: absolute; color: var(--pink); opacity: 0.35;
            pointer-events: none; animation: floatUp linear infinite;
            z-index: -1;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity:0; }
            50% { opacity: 0.7; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity:0; }
        }

        /* FLOWER RAIN - new element */
        .flower-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }
        .flower {
            position: absolute;
            color: #ffb7c5; /* soft pink */
            font-size: 24px;
            opacity: 0.7;
            user-select: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
        }

        /* Countdown bar */
        .countdown-bar {
            position: fixed; top:0; left:0; right:0; padding: 10px;
            background: rgba(255,107,157,0.12); backdrop-filter: blur(12px);
            z-index: 1000; text-align: center; color: var(--pink);
            font-weight: 600; display: none; border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* FIXED ENTRANCE - 50/50 VIDEO + PASS CARD */
        #entrance {
            position: fixed; inset: 0; z-index: 999;
            display: flex; flex-direction: column;
            background: #000;
            height: 100vh;
            overflow: hidden;
        }
        #entrance.hidden { display: none !important; }
        
        #introVideo {
            flex: 1; 
            width: 100%;
            height: 50vh;
            object-fit: contain !important;
            object-position: center;
        }

        .pass-card-container {
            flex: 1; 
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
        }

        .pass-card {
            background: var(--glass); 
            backdrop-filter: blur(20px);
            padding: 2.5rem 2rem; 
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.12);
            text-align: center; 
            width: 90%; 
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        .pass-card h1 { 
            font-family: 'Great Vibes', cursive; 
            font-size: clamp(2.5rem, 8vw, 3.4rem); 
            color: var(--pink); 
            margin-bottom: 0.8rem; 
        }
        .styled-input {
            width: 100%; padding: 14px; border-radius: 50px; border: none;
            background: white; color: #111; font-size: 1.1rem; text-align: center;
            margin: 1.2rem 0; outline: none;
        }
        .primary-btn {
            background: linear-gradient(45deg, var(--pink), var(--hot-pink));
            color: white; border: none; padding: 14px 48px; border-radius: 50px;
            cursor: pointer; font-weight: 600; font-size: 1.05rem;
            box-shadow: 0 10px 25px rgba(255,0,85,0.4);
            transition: all 0.3s;
        }
        .primary-btn:active { transform: scale(0.96); }

        /* Transition Video */
        #transition-video {
            position: fixed; inset: 0; z-index: 999;
            width: 100vw; height: 100vh;
            display: none; 
            align-items: center; justify-content: center;
            background: #000;
        }
        #transition-video.show { 
            display: flex !important;
        }
        #btsVideo {
            width: 100vw; height: 100vh;
            object-fit: contain !important;
            object-position: center;
        }

        #main-content {
            display: none; opacity: 0; transform: scale(0.92);
            transition: opacity 1.4s cubic-bezier(0.34, 1.56, 0.64, 1), transform 1.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 90px 15px 100px; 
            min-height: 100vh; 
            text-align: center;
            position: relative;
            z-index: 10;
        }
        #main-content.visible { 
            display: block; 
            opacity: 1; 
            transform: scale(1); 
        }

        .hero-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3.2rem, 10vw, 5.2rem);
            background: linear-gradient(90deg, #fff, var(--pink), #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 0.6rem; animation: glow 3s infinite alternate;
        }
        @keyframes glow { 
            0%,100% { text-shadow: 0 0 15px var(--pink); } 
            50% { text-shadow: 0 0 35px var(--hot-pink); } 
        }

        /* CAROUSEL */
        .carousel-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
            padding: 20px 0;
            margin: 20px 0;
            cursor: grab;
            touch-action: pan-x pan-y;
        }
        .carousel {
            display: flex;
            gap: 15px;
            padding: 0 10px;
            width: max-content;
        }
        .carousel-item {
            flex: 0 0 85vw; 
            max-width: 380px;
            scroll-snap-align: center;
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            padding: 20px 10px;
            background: transparent;
            transition: transform 0.2s;
        }
        .photo-frame {
            width: 100%; 
            max-width: 320px;
            aspect-ratio: 3/4;
            position: relative;
            background: linear-gradient(145deg, rgba(255,255,255,0.15), rgba(255,107,157,0.12));
            border-radius: 24px; 
            overflow: hidden; 
            border: 3px solid rgba(255,107,157,0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            transition: all 0.4s ease;
        }
        .carousel-item .caption {
            margin-top: 12px; 
            background: linear-gradient(145deg, rgba(0,0,0,0.8), rgba(255,107,157,0.2));
            color: #fff; 
            padding: 12px 15px; 
            border-radius: 20px; 
            max-width: 95%;
            font-family: 'Playfair Display', serif; 
            font-size: clamp(0.8rem, 2.8vw, 1rem);
            font-style: italic; 
            text-align: center; 
            font-weight: 400;
            word-break: break-word;
            border: 1px solid rgba(255,255,255,0.3); 
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            line-height: 1.3;
        }
        .carousel-item.active .photo-frame {
            box-shadow: 0 35px 80px rgba(255,107,157,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
            border-color: rgba(255,107,157,0.7);
        }
        .carousel-item.active img { 
            filter: brightness(1.2) saturate(1.3); 
            transform: scale(1.02); 
        }
        .carousel-item.active .caption {
            background: linear-gradient(145deg, rgba(255,107,157,0.3), rgba(255,0,85,0.2));
            box-shadow: 0 12px 30px rgba(255,107,157,0.5);
        }

        /* Letter Modal */
        .letter-overlay {
            position: fixed; inset: 0; background: rgba(10,5,20,0.95);
            backdrop-filter: blur(15px); z-index: 2000; display: none;
            align-items: center; justify-content: center;
        }
        .letter-overlay.active { display: flex; }
        .letter-paper {
            background: linear-gradient(145deg, #f9e4e4, #f0d0d0);
            width: 90%; max-width: 600px; height: 80vh; border-radius: 25px;
            padding: 3rem; box-shadow: 0 30px 100px rgba(255,107,157,0.3);
            position: relative; overflow-y: auto; border: 3px solid rgba(255,107,157,0.3);
        }
        /* Typewriter container */
        #typewriter {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            line-height: 1.6;
            color: #ff2663;
            text-align: center;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-right: 2px solid transparent; /* no cursor during animation */
        }
        .typewriter-cursor {
            display: inline-block;
            width: 2px;
            height: 1.4em;
            background-color: #ff2663;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .close-letter {
            position: absolute; top: 20px; right: 25px; background: none;
            border: none; font-size: 2rem; color: var(--pink); cursor: pointer;
            width: 40px; height: 40px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; transition: all 0.3s;
        }
        .close-letter:hover { background: rgba(255,107,157,0.2); transform: scale(1.1); }

        @media (max-width: 480px) {
            .carousel-item { flex: 0 0 92vw; padding: 10px 5px; }
            .carousel-item .caption { 
                max-width: 92vw; 
                font-size: clamp(0.75rem, 2.5vw, 0.95rem);
                padding: 10px 12px;
            }
        }

        body {
            overflow-y: auto;
            overflow-x: hidden;
        }
    </style>
</head>
<body>
    <!-- Permission Gate -->
    <section id="permissionGate" style="position:fixed; inset:0; background:linear-gradient(135deg,#1a0b2e,#0a0514); z-index:2000; display:flex; align-items:center; justify-content:center; text-align:center;">
        <div style="background:rgba(255,255,255,0.08); backdrop-filter:blur(20px); padding:2.5rem 2rem; border-radius:28px; width:90%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,.7);">
            <h1 style="font-family:'Great Vibes',cursive;color:#ff6b9d;font-size:3rem;">Hey Sreetoma 💕</h1>
            <p style="margin:1.2rem 0;opacity:.85;">Does <b>Abir</b> Really know you? 🌸</p>
            <button class="primary-btn" onclick="grantAudio()">Yes 💖</button>
        </div>
    </section>

    <div id="bg-canvas"></div>
    
    <!-- FLOWER RAIN container (hidden until after transition) -->
    <div id="flowerRain" class="flower-container" style="display: none;"></div>

    <!-- Entrance - 50/50 Split -->
    <section id="entrance">
        <video id="introVideo" autoplay muted loop playsinline preload="metadata">
            <source src="mem.mp4" type="video/mp4">
        </video>
        <div class="pass-card-container">
            <div class="pass-card">
                <h1>Sreetoma</h1>
                <p style="margin:1.2rem 0; opacity:0.85;">Our secret place ✨</p>
                <input type="password" id="pInput" class="styled-input" placeholder="Enter our code">
                <button class="primary-btn" onclick="checkPassword()">Unlock My Heart</button>
            </div>
        </div>
    </section>

    <!-- Transition Video -->
    <div id="transition-video">
        <video id="btsVideo" autoplay muted playsinline preload="metadata">
            <source src="bts.mp4" type="video/mp4">
        </video>
    </div>

    <div class="countdown-bar" id="cBar">Birthday in: --d --h --m --s</div>

    <!-- Main Content -->
    <section id="main-content">
        <h1 class="hero-title">Sreetoma Mazumdar</h1>
        <p style="font-style:italic; margin:1.5rem 0 2.5rem;">"You are my favorite kind of magic."</p>
        <div style="text-align:center; margin:2rem 0;">
            <button class="primary-btn" onclick="toggleLetter(true)">Open My Letter 💌</button>
        </div>

        <div style="color:var(--pink); margin-bottom:0.5rem;">← swipe →</div>

        <div class="carousel-wrapper" id="carouselWrapper">
            <div class="carousel" id="carousel"></div>
        </div>

        <p style="margin-top:3rem; opacity:0.9; font-size:0.95rem;">
            Swipe left / right to explore our moments 💕
        </p>
    </section>

    <!-- Letter Modal -->
    <div class="letter-overlay" id="letterOverlay">
        <div class="letter-paper">
            <button class="close-letter" onclick="toggleLetter(false)">×</button>
            <div id="typewriter"></div>
        </div>
    </div>

    <audio id="player" loop preload="auto">
        <source src="Until.mp3" type="audio/mpeg">
    </audio>

    <script>
        const ACCESS_CODE = "2252421098";
        let currentIndex = 0;
        const TOTAL_IMAGES = 60;

        const CAPTIONS = [
            "The moment I knew you were my forever 🤍","Your smile still stops my heart every time 🌸",
            "You make ordinary days feel like magic 💜","My safe place in every storm 🫂",
            "This laugh is my favorite sound ever 🎶","You looked at me and the world disappeared ✨",
            "Every second with you feels stolen from time 💕","You're the best plot twist of my life 📖",
            "Home isn't a place — it's you 🏡❤️","Your hand in mine still gives me butterflies 🦋",
            "The day I fell a little harder 🤍","You make quiet moments the loudest memories 🌙",
            "My heart whispers your name every night 🌌","You're the softest thing in my chaotic world 🌷",
            "This hug fixed everything that day 🤗","You're proof fairytales are real 🧚‍♀️",
            "Every glance feels like a love letter 💌","You make me believe in soulmates ✨",
            "My favorite notification is still you 📱❤️","When you laugh, the whole room lights up 💡",
            "You're the calm in my storm ⚓","This photo hides how fast my heart was racing 🏃‍♂️💓",
            "You make me want to be better, every day 🌱","My comfort person, always 🧸",
            "You're prettier than every sunset we've chased 🌅","This moment replayed in my head for weeks 🎞️",
            "You're my favorite kind of chaos 💥❤️","I still get nervous when you look at me like that 😳",
            "You make loving you the easiest thing I've ever done 🌼","My heart knew before my brain did 💭",
            "Every 'good morning' text from you feels like a hug 📩🤗","You're the reason I believe in magic again 🪄",
            "This day changed everything for me forever 🔄","Your voice is my favorite playlist 🎧",
            "You're the poem I never knew how to write 📜","I'd choose this moment again and again ♾️",
            "You make the stars jealous and make me Harder✨","My favorite place is right next to you 🛋️❤️",
            "Every photo of us feels like home 📸🏠","You're still my favorite daydream 🌸",
            "This smile was only for you that day 😊","You make time feel slow and beautiful ⏳",
            "My heart beats your name in silence 💓","You're the gentle in all my rough edges 🌿",
            "This laugh is tattooed in my soul 🖤","You're the answer to every question I never asked ❓❤️",
            "Every tiny moment with you is massive to me 🌍","You're my soft landing after every fall 🪂",
            "This look still gives me chills 🥶❤️","You make loving feel safe and wild at the same time 🌪️🤍",
            "My forever starts and ends with you ♾️","You're the spark that never fades 🔥",
            "This hug healed things I didn't know were broken 🩹","You're my favorite what-if that became real 💭→❤️",
            "Every second apart feels too long ⏱️","You make me believe in happy endings 📖✨",
            "This photo is proof you're my miracle 🌟","You're the calm I never knew I needed 🌊",
            "My heart still races every time I see you 😍","And I'll keep choosing you — today, tomorrow, always 💍🤍 sorry ektu besi hoye gese pera nai mone kisu koris na. Manger Nati )"
        ];

        const LETTER_TEXT = `My dearest Sreetoma, 💕\n\nEvery moment with you feels like a dream I never want to wake from. ✨\nYour smile lights up my darkest days 🌸, your laugh is my favorite melody 🎶, \nand your love is the home I've always been searching for. 🏡❤️\n\nYou are my forever ♾️, my always, my everything. \nHappy birthday month, my love! 🎂💖 Here's to countless more memories together. 🌟\n\nForever yours,\nAbir 💍🤍`;

        function grantAudio() {
            document.getElementById('permissionGate').style.display = 'none';
            const intro = document.getElementById('introVideo');
            intro.muted = false; intro.volume = 0.7; intro.play().catch(() => {});
        }

        function checkPassword() {
            const code = document.getElementById('pInput').value;
            if (code !== ACCESS_CODE) { 
                alert("Wrong code, my love 💕 It is 2252421098. Abir really got Upset about you 🥹 No No, sorry. Abir can't upset on you my Baby Girl, Ummah 😘🫦"); 
                return; 
            }

            const intro = document.getElementById('introVideo');
            const transition = document.getElementById('transition-video');
            const bts = document.getElementById('btsVideo');

            intro.muted = true; intro.pause(); intro.currentTime = 0;
            document.getElementById('entrance').classList.add('hidden');
            
            transition.classList.add('show');

            bts.muted = false; 
            bts.volume = 0.75; 
            bts.currentTime = 0; 
            bts.play().catch(e => console.log('Video play failed:', e));

            bts.onended = () => {
                transition.classList.remove('show');
                // START FLOWER RAIN
                startFlowerRain();
                
                const main = document.getElementById('main-content');
                main.style.display = 'block';
                setTimeout(() => main.classList.add('visible'), 100);
                document.getElementById('cBar').style.display = 'block';

                const player = document.getElementById('player');
                player.volume = 0.4;
                player.play().catch(() => {
                    document.addEventListener('click', () => player.play(), { once: true });
                });
                init();
            };
        }

        // FLOWER RAIN function
        function startFlowerRain() {
            const container = document.getElementById('flowerRain');
            container.style.display = 'block';
            // Clear any previous flowers
            container.innerHTML = '';
            const flowerCount = 40;
            for (let i = 0; i < flowerCount; i++) {
                const flower = document.createElement('div');
                flower.className = 'flower';
                // Random flower emoji or petal symbol
                const flowers = ['🌸', '🌼', '🌻', '🌺', '🌸', '🌷', '💮', '🏵️'];
                flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
                flower.style.left = Math.random() * 100 + '%';
                flower.style.animationDuration = (Math.random() * 5 + 5) + 's'; // 5-10s
                flower.style.fontSize = (Math.random() * 20 + 20) + 'px';
                flower.style.opacity = Math.random() * 0.6 + 0.3;
                flower.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(flower);
            }
        }

        function init() {
            generateHearts();
            buildCarousel();
            startTimer();
            setupCarouselScroll();
        }

        function buildCarousel() {
            const container = document.getElementById('carousel');
            let html = '';
            for (let i = 1; i <= TOTAL_IMAGES; i++) {
                const captionIndex = (i - 1) % CAPTIONS.length;
                html += `
                    <div class="carousel-item ${i === 1 ? 'active' : ''}" data-index="${i-1}">
                        <div class="photo-frame">
                            <img src="images/${i}.jpg" alt="Memory ${i}" 
                                 onerror="this.src='https://via.placeholder.com/400x500/ff6b9d/ffffff?text=Us+${i}'">
                        </div>
                        <div class="caption">${CAPTIONS[captionIndex]}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
            setActiveFromIndex(0);
        }

        function setActiveFromIndex(index) {
            const items = document.querySelectorAll('.carousel-item');
            items.forEach((item, i) => {
                if (i === index) item.classList.add('active');
                else item.classList.remove('active');
            });
            currentIndex = index;
        }

        function setupCarouselScroll() {
            const wrapper = document.getElementById('carouselWrapper');
            wrapper.addEventListener('scroll', () => {
                const scrollLeft = wrapper.scrollLeft;
                const itemWidth = wrapper.clientWidth * 0.85 + 15;
                const newIndex = Math.round(scrollLeft / itemWidth);
                if (newIndex >= 0 && newIndex < TOTAL_IMAGES && newIndex !== currentIndex) {
                    setActiveFromIndex(newIndex);
                }
            });

            document.querySelectorAll('.carousel-item').forEach((item, idx) => {
                item.addEventListener('click', (e) => {
                    const rect = item.getBoundingClientRect();
                    const clickX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
                    if (!clickX) return;
                    const centerX = rect.left + rect.width / 2;
                    
                    let targetIndex = currentIndex;
                    if (clickX < centerX) targetIndex = (currentIndex - 1 + TOTAL_IMAGES) % TOTAL_IMAGES;
                    else targetIndex = (currentIndex + 1) % TOTAL_IMAGES;

                    const itemWidth = wrapper.clientWidth * 0.85 + 15;
                    wrapper.scrollTo({ left: targetIndex * itemWidth, behavior: 'smooth' });
                    setActiveFromIndex(targetIndex);
                });
                item.querySelector('img').addEventListener('mousedown', (e) => e.preventDefault());
            });
        }

        function toggleLetter(show) {
            const overlay = document.getElementById('letterOverlay');
            overlay.classList.toggle('active', show);
            if (show) {
                // Start typewriter effect
                typeWriterEffect(LETTER_TEXT, 'typewriter', 50);
            } else {
                // reset content for next time (optional)
                document.getElementById('typewriter').innerHTML = '';
            }
        }

        // TYPEWRITER FUNCTION
        function typeWriterEffect(fullText, elementId, speed = 40) {
            const element = document.getElementById(elementId);
            element.innerHTML = ''; // clear
            let i = 0;
            function type() {
                if (i < fullText.length) {
                    // Handle newline as <br> for proper display
                    let char = fullText.charAt(i);
                    if (char === '\n') {
                        element.innerHTML += '<br>';
                    } else {
                        element.innerHTML += char;
                    }
                    i++;
                    setTimeout(type, speed);
                } else {
                    // add a blinking cursor at the end (optional)
                    element.innerHTML += '<span class="typewriter-cursor"></span>';
                }
            }
            type();
        }

        function startTimer() {
            const target = new Date("February 10, 2026 00:00:00").getTime();
            setInterval(() => {
                const dist = target - Date.now();
                if (dist < 0) {
                    document.getElementById('cBar').textContent = "It's your birthday month! 🎂❤️";
                    return;
                }
                const d = Math.floor(dist / 86400000);
                const h = Math.floor((dist % 86400000) / 3600000);
                const m = Math.floor((dist % 3600000) / 60000);
                const s = Math.floor((dist % 60000) / 1000);
                document.getElementById('cBar').textContent = `Birthday glow: ${d}d ${h}h ${m}m ${s}s ✨`;
            }, 1000);
        }

        function generateHearts() {
            for (let i = 0; i < 28; i++) {
                const h = document.createElement('div');
                h.className = 'floating-heart';
                h.textContent = '❤️';
                h.style.left = Math.random() * 100 + 'vw';
                h.style.animationDuration = (Math.random() * 14 + 9) + 's';
                h.style.fontSize = (Math.random() * 24 + 16) + 'px';
                h.style.animationDelay = Math.random() * 6 + 's';
                document.body.appendChild(h);
            }
        }
    </script>
</body>
</html>
