<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Sreetoma ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff6b9d;
            --hot-pink: #ff0055;
            --dark-bg: #0a0514;
            --glass: rgba(255, 255, 255, 0.08);
            --carousel-item-width:  clamp(220px, 65vw, 380px);
            --carousel-item-height: clamp(330px, 90vw, 570px);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--dark-bg);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            height: 100vh;
            margin: 0;
            touch-action: manipulation;
        }

        /* Background & Hearts */
        #bg-canvas {
            position: fixed; inset: 0; z-index: -2;
            background: radial-gradient(circle at center, #1a0b2e 0%, #0a0514 100%);
        }
        .floating-heart {
            position: absolute; color: var(--pink); opacity: 0.35;
            pointer-events: none; animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity:0; }
            50% { opacity: 0.7; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity:0; }
        }

        /* Countdown bar */
        .countdown-bar {
            position: fixed; top:0; left:0; right:0; padding: 10px;
            background: rgba(255,107,157,0.12); backdrop-filter: blur(12px);
            z-index: 1000; text-align: center; color: var(--pink);
            font-weight: 600; display: none; border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* Entrance + Videos */
        #entrance, #transition-video {
            position: fixed; inset: 0; z-index: 999;
            display: flex; align-items: center; justify-content: center;
            background: #000;
            transition: opacity 1.2s ease;
        }
        #entrance.hidden, #transition-video.hidden { opacity: 0; pointer-events: none; }

        video {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .pass-card {
            position: absolute; z-index: 10;
            background: var(--glass); backdrop-filter: blur(20px);
            padding: 2.5rem 2rem; border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.12);
            text-align: center; width: 90%; max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        .pass-card h1 { font-family: 'Great Vibes', cursive; font-size: 3.4rem; color: var(--pink); margin-bottom: 0.8rem; }
        .styled-input {
            width: 100%; padding: 14px; border-radius: 50px; border: none;
            background: white; color: #111; font-size: 1.1rem; text-align: center;
            margin: 1.2rem 0; outline: none;
        }
        .primary-btn {
            background: linear-gradient(45deg, var(--pink), var(--hot-pink));
            color: white; border: none; padding: 14px 48px; border-radius: 50px;
            cursor: pointer; font-weight: 600; font-size: 1.05rem;
            box-shadow: 0 10px 25px rgba(255,0,85,0.4);
            transition: all 0.3s;
        }
        .primary-btn:active { transform: scale(0.96); }

        /* Main content reveal animation */
        #main-content {
            display: none;
            opacity: 0;
            transform: scale(0.92);
            transition: all 1.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 90px 15px 100px;
            min-height: 100vh;
            text-align: center;
        }
        #main-content.visible {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .hero-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3.2rem, 10vw, 5.2rem);
            background: linear-gradient(90deg, #fff, var(--pink), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.6rem;
            animation: glow 3s infinite alternate;
        }
        @keyframes glow {
            0%,100% { text-shadow: 0 0 15px var(--pink); }
            50%     { text-shadow: 0 0 35px var(--hot-pink); }
        }

        /* ─── 3D INFINITE CAROUSEL ─── */
        .carousel-wrapper {
            perspective: 1100px;
            width: 100%;
            max-width: 1100px;
            height: 70vh;
            margin: 40px auto;
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
        }
        .carousel {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            user-select: none;
        }
        .carousel-item {
            position: absolute;
            width: var(--carousel-item-width);
            height: var(--carousel-item-height);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            transition: all 0.5s ease;
            cursor: grab;
        }
        .carousel-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.65);
            border: 2px solid rgba(255,107,157,0.25);
            transition: all 0.4s ease;
        }
        .carousel-item.active img {
            transform: scale(1.08);
            box-shadow: 0 30px 70px rgba(255,107,157,0.45);
            filter: brightness(1.1) saturate(1.15);
        }
        .carousel-item.prev, .carousel-item.next {
            opacity: 0.75;
            filter: brightness(0.8) saturate(0.85) blur(1px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .carousel-wrapper { height: 58vh; margin: 30px auto; }
            :root { --carousel-item-width: 78vw; --carousel-item-height: 110vw; }
        }
        @media (max-width: 480px) {
            .hero-title { font-size: 2.9rem; }
            .pass-card { padding: 2rem 1.5rem; }
        }

        /* Chat, Letter (kept minimal - copy your full styles if needed) */
        .chat-widget { position:fixed; bottom:20px; right:20px; z-index:2000; display:none; }
        .letter-overlay { /* your original */ }
    </style>
</head>
<body>
    <div id="bg-canvas"></div>

    <!-- Entrance video + password -->
    <section id="entrance">
        <video id="introVideo" autoplay muted loop playsinline>
            <source src="mem.mp4" type="video/mp4">
        </video>
        <div class="pass-card">
            <h1>Sreetoma</h1>
            <p style="margin:1.2rem 0; opacity:0.85;">Our secret place ✨</p>
            <input type="password" id="pInput" class="styled-input" placeholder="Enter our code">
            <button class="primary-btn" onclick="checkPassword()">Unlock My Heart</button>
        </div>
    </section>

    <!-- Transition video (hidden initially) -->
    <div id="transition-video" class="hidden">
        <video id="btsVideo" autoplay muted playsinline>
            <source src="bts.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Countdown -->
    <div class="countdown-bar" id="cBar">Birthday in: --d --h --m --s</div>

    <!-- Main content -->
    <section id="main-content">
        <h1 class="hero-title">Sreetoma Mazumdar</h1>
        <p style="font-style:italic; margin:1.5rem 0 2.5rem;">"You are my favorite kind of magic."</p>

        <div style="text-align:center; margin:2rem 0;">
            <button class="primary-btn" onclick="toggleLetter(true)">Open My Letter 💌</button>
        </div>

        <!-- 3D Carousel -->
        <div class="carousel-wrapper">
            <div class="carousel" id="carousel"></div>
        </div>

        <p style="margin-top:3rem; opacity:0.9; font-size:0.95rem;">
            Swipe left / right to explore our moments 💕
        </p>
    </section>

    <!-- Chat widget (your original - add back full styles) -->
    <div class="chat-widget" id="chatWidget" style="display:none;">
        <!-- your chat HTML + JS here -->
    </div>

    <!-- Letter overlay (your original) -->
    <div class="letter-overlay" id="letterOverlay">
        <!-- your letter-paper + typewriter -->
    </div>

    <!-- Background music -->
    <audio id="player" loop playsinline>
        <source src="Until.mp3" type="audio/mpeg">
    </audio>

    <script>
        const ACCESS_CODE = "2252421098";
        let currentIndex = 0;
        let isDragging = false;
        let startX = 0;
        let currentTranslate = 0;
        let prevTranslate = 0;
        const TOTAL_IMAGES = 60;

        // Check password
function checkPassword() {
    const code = document.getElementById('pInput').value;
    if (code === ACCESS_CODE) {
        // Hide entrance (video + card)
        document.getElementById('entrance').classList.add('hidden');

        // Show transition video
        const transitionSection = document.getElementById('transition-video');
        transitionSection.classList.remove('hidden');

        const bts = document.getElementById('btsVideo');
        
        bts.onended = function() {
            // Hide transition video
            transitionSection.classList.add('hidden');

            // Reveal main content with animation
            const main = document.getElementById('main-content');
            main.style.display = 'block';
            setTimeout(() => main.classList.add('visible'), 100);

            // Show countdown, chat, etc.
            document.getElementById('cBar').style.display = 'block';
            document.getElementById('chatWidget').style.display = 'block';

            // Start the romantic background music now
            const player = document.getElementById('player');
            player.volume = 0;           // start silent
            player.play().then(() => {
                // Fade in volume smoothly (nice touch)
                let vol = 0;
                const fadeInterval = setInterval(() => {
                    vol += 0.05;
                    if (vol >= 0.4) {        // max volume ~40% to not overpower
                        player.volume = 0.4;
                        clearInterval(fadeInterval);
                    } else {
                        player.volume = vol;
                    }
                }, 150);                     // ~3 second fade-in
            }).catch(err => {
                console.log("Music autoplay blocked:", err);
                // Optional: show small note "Tap anywhere to play music ♫"
            });

            // Initialize hearts, carousel, timer
            init();
        };
    } else {
        alert("Wrong code, my love. Try again 💕");
    }
}

        function init() {
            generateHearts();
            buildCarousel();
            startTimer();
            setupCarousel();
        }

        function buildCarousel() {
            const container = document.getElementById('carousel');
            let html = '';
            for (let i = 1; i <= TOTAL_IMAGES; i++) {
                html += `
                    <div class="carousel-item" data-index="${i-1}">
                        <img src="images/${i}.jpg" alt="Memory ${i}"
                             onerror="this.src='https://via.placeholder.com/500x750/ff6b9d/ffffff?text=Us+${i}'">
                    </div>
                `;
            }
            container.innerHTML = html;
            updateCarousel();
        }

        function updateCarousel() {
            const items = document.querySelectorAll('.carousel-item');
            items.forEach((item, idx) => {
                const diff = idx - currentIndex;
                let pos = diff * 100; // percentage based shift

                // Infinite loop logic
                if (Math.abs(diff) > TOTAL_IMAGES / 2) {
                    pos += diff > 0 ? -TOTAL_IMAGES * 100 : TOTAL_IMAGES * 100;
                }

                item.style.transform = `translateX(${pos}%) translateZ(${Math.abs(diff) * -120}px) rotateY(${diff * -12}deg)`;
                item.classList.remove('active', 'prev', 'next');

                if (diff === 0) item.classList.add('active');
                if (diff === -1) item.classList.add('prev');
                if (diff === 1) item.classList.add('next');
            });
        }

        function setupCarousel() {
            const wrapper = document.querySelector('.carousel-wrapper');
            const carousel = document.getElementById('carousel');

            // Touch / Mouse events
            const handleStart = (e) => {
                isDragging = true;
                startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
                prevTranslate = currentTranslate;
                carousel.style.transition = 'none';
            };

            const handleMove = (e) => {
                if (!isDragging) return;
                const currentX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
                const diff = currentX - startX;
                currentTranslate = prevTranslate + diff * 0.8; // sensitivity

                carousel.style.transform = `translateX(${currentTranslate}px)`;
            };

            const handleEnd = () => {
                if (!isDragging) return;
                isDragging = false;
                carousel.style.transition = 'transform 0.45s cubic-bezier(0.25,0.46,0.45,0.94)';

                const movedBy = currentTranslate - prevTranslate;
                if (Math.abs(movedBy) > 60) { // threshold
                    if (movedBy > 0) currentIndex = (currentIndex - 1 + TOTAL_IMAGES) % TOTAL_IMAGES;
                    else currentIndex = (currentIndex + 1) % TOTAL_IMAGES;
                }

                currentTranslate = 0;
                updateCarousel();
            };

            wrapper.addEventListener('mousedown', handleStart);
            wrapper.addEventListener('mousemove', handleMove);
            wrapper.addEventListener('mouseup', handleEnd);
            wrapper.addEventListener('mouseleave', handleEnd);

            wrapper.addEventListener('touchstart', handleStart);
            wrapper.addEventListener('touchmove', handleMove);
            wrapper.addEventListener('touchend', handleEnd);
        }

        function startTimer() {
            const target = new Date("February 10, 2026 00:00:00").getTime();
            setInterval(() => {
                const dist = target - Date.now();
                if (dist < 0) {
                    document.getElementById('cBar').textContent = "It's your birthday month! 🎂❤️";
                    return;
                }
                const d = Math.floor(dist / 86400000);
                const h = Math.floor((dist % 86400000) / 3600000);
                const m = Math.floor((dist % 3600000) / 60000);
                const s = Math.floor((dist % 60000) / 1000);
                document.getElementById('cBar').textContent = `Birthday glow: ${d}d ${h}h ${m}m ${s}s ✨`;
            }, 1000);
        }

        function generateHearts() {
            for (let i = 0; i < 28; i++) {
                const h = document.createElement('div');
                h.className = 'floating-heart';
                h.textContent = '❤️';
                h.style.left = Math.random() * 100 + 'vw';
                h.style.animationDuration = (Math.random() * 14 + 9) + 's';
                h.style.fontSize = (Math.random() * 24 + 16) + 'px';
                h.style.animationDelay = Math.random() * 6 + 's';
                document.body.appendChild(h);
            }
        }

        // Your other functions: toggleLetter, toggleChat, abirSay, askAbir, typewriter...
        // Paste them here from your original code
    </script>
</body>
</html>
